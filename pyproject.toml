[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectramap"
version = "0.1.0.dev0"
description = "Map the radio-frequency environment across physical space: RF(lat, lon, alt, frequency, time)"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Mu In Nasif" }]
requires-python = ">=3.10"
keywords = ["sdr", "rtl-sdr", "rf", "spectrum", "gis", "dsp", "mapping"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
  "Topic :: Communications :: Ham Radio",
]

# Core stays deliberately thin: numpy for DSP, PyYAML for survey configuration.
# Everything else (hardware drivers, plotting, columnar export) is an extra so that
# CI and the whole simulated vertical slice run with two dependencies.
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
rtlsdr = ["pyrtlsdr>=0.3.0"]
gps = ["pyserial>=3.5"]
parquet = ["pyarrow>=14.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
spectramap = "spectramap.cli:main"

[project.urls]
Homepage = "https://github.com/IotA-asce/spectramap"
Documentation = "https://github.com/IotA-asce/spectramap/tree/main/docs"
Issues = "https://github.com/IotA-asce/spectramap/issues"

[tool.hatch.build.targets.wheel]
# Non-Python files inside the package (the viewer's app.html) are included
# automatically; a force-include entry would add them a second time and fail the build.
packages = ["src/spectramap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
